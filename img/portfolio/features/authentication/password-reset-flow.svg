<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1320" role="img" aria-labelledby="title desc">
  <title id="title">Khôi phục mật khẩu Client bằng OTP</title>
  <desc id="desc">Sơ đồ ba bước: gửi yêu cầu khôi phục với phản hồi chung để tránh dò email, xác minh OTP tối đa năm lần và cấp reset token ngắn hạn, sau đó cập nhật mật khẩu trong transaction và thu hồi các phiên cũ.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18879a"/></marker>
    <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d66c68"/></marker>
    <style>
      text{font-family:Arial,sans-serif}.title{font-size:28px;font-weight:700;fill:#173542}.sub{font-size:15px;fill:#687b84}.section{font-size:12px;font-weight:700;letter-spacing:.1em;fill:#178194}.head{font-size:16px;font-weight:700;fill:#173542}.body{font-size:13px;fill:#405964}.small{font-size:12px;fill:#687b84}.mono{font:12px Consolas,monospace;fill:#355665}.route{font:10px Consolas,monospace;fill:#355665}.panel{fill:#fff;stroke:#dce7eb;stroke-width:1.4}.blue{fill:#eff8fa;stroke:#b8dfe5}.redis{fill:#fff6f1;stroke:#efcabb}.red{fill:#fff3f1;stroke:#edc2bd}.amber{fill:#fff9ed;stroke:#efdfbd}.green{fill:#f2f8f2;stroke:#c8dfc7}.line{fill:none;stroke:#18879a;stroke-width:2.2;marker-end:url(#arr)}.line-red{fill:none;stroke:#d66c68;stroke-width:2.1;marker-end:url(#arr-red)}.divider{stroke:#e5edf0;stroke-width:1.2}
    </style>
  </defs>
  <rect x="1" y="1" width="1518" height="1318" rx="22" fill="url(#bg)" stroke="#e5edf0"/>
  <text x="48" y="54" class="title">Khôi phục mật khẩu Client · OTP → reset token</text>
  <text x="48" y="82" class="sub">Email chỉ xác minh quyền sở hữu tài khoản; token đặt lại có thời hạn ngắn và chỉ được sử dụng một lần.</text>

  <rect x="40" y="112" width="1440" height="330" rx="18" class="panel"/>
  <text x="68" y="148" class="section">1 · YÊU CẦU MÃ KHÔI PHỤC</text>
  <rect x="68" y="174" width="300" height="112" rx="14" class="blue"/>
  <text x="92" y="207" class="head">Client gửi email</text>
  <text x="92" y="235" class="small">ForgotPassword.tsx → FE API</text>
  <text x="92" y="260" class="route">POST /auth/client/password-reset/request</text>
  <rect x="438" y="174" width="420" height="112" rx="14" class="redis"/>
  <text x="462" y="207" class="head">BE kiểm quota Redis</text>
  <text x="462" y="235" class="small">Vượt quota → 429 + Retry-After</text>
  <text x="462" y="260" class="small">Tìm tài khoản Client đủ điều kiện</text>
  <path d="M368 230H430" class="line"/>
  <rect x="928" y="174" width="500" height="112" rx="14" class="green"/>
  <text x="952" y="207" class="head">Nếu tài khoản phù hợp</text>
  <text x="952" y="235" class="small">Tạo OTP 6 số · lưu HMAC hash · hết hạn sau 5 phút</text>
  <text x="952" y="260" class="small">Ghi challenge trong DB rồi gửi email qua SMTP</text>
  <path d="M858 230H920" class="line"/>
  <rect x="68" y="320" width="1360" height="88" rx="12" class="amber"/>
  <text x="92" y="352" class="head">Phản hồi thông thường: 202 với cùng thông báo</text>
  <text x="92" y="380" class="small">Email không tồn tại hoặc gửi email lỗi vẫn không tiết lộ trạng thái tài khoản; lỗi SMTP được ghi log để vận hành kiểm tra.</text>

  <path d="M760 442V475" class="line"/>

  <rect x="40" y="486" width="1440" height="350" rx="18" class="panel"/>
  <text x="68" y="522" class="section">2 · XÁC MINH OTP VÀ CẤP QUYỀN ĐẶT LẠI</text>
  <rect x="68" y="548" width="300" height="116" rx="14" class="blue"/>
  <text x="92" y="581" class="head">Client nhập OTP</text>
  <text x="92" y="609" class="small">OTPPassword.tsx gửi email + mã</text>
  <text x="92" y="638" class="route">POST /auth/client/password-reset/verify</text>
  <rect x="438" y="548" width="420" height="116" rx="14" class="panel"/>
  <text x="462" y="581" class="head">BE kiểm tra challenge</text>
  <text x="462" y="609" class="small">So sánh hash an toàn · còn hạn · chưa xác minh</text>
  <text x="462" y="638" class="small">Sai mã tăng bộ đếm; tối đa 5 lần thử</text>
  <path d="M368 606H430" class="line"/>
  <rect x="68" y="696" width="790" height="86" rx="12" class="red"/>
  <text x="92" y="730" class="head">Mã sai, hết hạn hoặc hết lượt → 401</text>
  <text x="92" y="756" class="small">Không cấp token; Client có thể yêu cầu mã mới nếu challenge đã hết hiệu lực.</text>
  <path d="M648 664V688H440V688" class="line-red"/>
  <rect x="928" y="548" width="500" height="116" rx="14" class="green"/>
  <text x="952" y="581" class="head">OTP hợp lệ → reset token</text>
  <text x="952" y="609" class="small">Token ngẫu nhiên một lần · DB chỉ lưu SHA-256 hash</text>
  <text x="952" y="638" class="small">Hết hạn sau 10 phút; FE giữ tạm trong sessionStorage</text>
  <path d="M858 606H920" class="line"/>
  <rect x="928" y="696" width="500" height="86" rx="12" class="amber"/>
  <text x="952" y="730" class="head">Admin dùng endpoint riêng</text>
  <text x="952" y="756" class="small">Chính sách MFA quản trị chỉ áp dụng tại bước xác minh này.</text>

  <path d="M760 836V869" class="line"/>

  <rect x="40" y="880" width="1440" height="390" rx="18" class="panel"/>
  <text x="68" y="916" class="section">3 · ĐẶT MẬT KHẨU MỚI VÀ THU HỒI PHIÊN CŨ</text>
  <rect x="68" y="942" width="300" height="130" rx="14" class="blue"/>
  <text x="92" y="975" class="head">Client gửi mật khẩu mới</text>
  <text x="92" y="1003" class="small">ResetPassword.tsx gửi reset token</text>
  <text x="92" y="1032" class="route">POST /auth/client/password-reset/confirm</text>
  <rect x="438" y="942" width="420" height="130" rx="14" class="panel"/>
  <text x="462" y="975" class="head">BE kiểm token và chính sách mật khẩu</text>
  <text x="462" y="1003" class="small">Token phải đúng hash, chưa dùng và còn hạn</text>
  <text x="462" y="1032" class="small">Hash mật khẩu mới trước khi ghi DB</text>
  <path d="M368 1007H430" class="line"/>
  <rect x="928" y="942" width="500" height="130" rx="14" class="green"/>
  <text x="952" y="975" class="head">Một transaction trong DB</text>
  <text x="952" y="1003" class="small">Tiêu thụ reset token + đổi mật khẩu</text>
  <text x="952" y="1032" class="small">Xóa refresh token và thu hồi mọi Device session cũ</text>
  <path d="M858 1007H920" class="line"/>
  <rect x="68" y="1100" width="1360" height="106" rx="12" class="green"/>
  <text x="92" y="1135" class="head">Thành công → FE xóa token tạm và chuyển về đăng nhập</text>
  <text x="92" y="1163" class="small">BE gửi email thông báo đổi mật khẩu; nếu gửi email lỗi, thay đổi mật khẩu vẫn được giữ và lỗi được ghi log.</text>
  <path d="M1178 1072V1084H748V1092" class="line"/>
  <rect x="68" y="1218" width="1360" height="42" rx="10" class="red"/>
  <text x="92" y="1245" class="small">Reset token sai, hết hạn hoặc đã dùng → 401; mật khẩu và phiên không bị thay đổi.</text>
</svg>
