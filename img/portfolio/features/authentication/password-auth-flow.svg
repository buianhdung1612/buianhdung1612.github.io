<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1320" role="img" aria-labelledby="title desc">
  <title id="title">Luồng đăng ký, đăng nhập và duy trì phiên Client</title>
  <desc id="desc">FE gửi biểu mẫu đăng ký tới BE; BE kiểm tra dữ liệu, băm mật khẩu và tạo Client. Khi đăng nhập, BE xác minh mật khẩu và quyền, lưu phiên thiết bị, đặt refresh cookie HttpOnly; FE làm mới hoặc kết thúc phiên qua API.</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbfc"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#078aa4"/></marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e87970"/></marker>
    <style>
      .title{font:700 27px Arial,sans-serif;fill:#173542}.subtitle{font:15px Arial,sans-serif;fill:#647984}
      .participant{fill:#fff;stroke:#dce7eb;stroke-width:1.5}.participant-fe{fill:#eef9fb;stroke:#a8dbe4}.participant-be{fill:#f3f7fb;stroke:#c5d5e3}.participant-db{fill:#f5f8f5;stroke:#ccdfd0}
      .participant-title{font:700 16px Arial,sans-serif;fill:#173542}.life{stroke:#cad5db;stroke-width:1.5;stroke-dasharray:6 7}
      .arrow{fill:none;stroke:#078aa4;stroke-width:2.5;marker-end:url(#arrow-blue)}.arrow-return{fill:none;stroke:#078aa4;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrow-blue)}.arrow-auth{fill:none;stroke:#e87970;stroke-width:2.5;marker-end:url(#arrow-coral)}
      .step{font:700 12px Arial,sans-serif;fill:#078aa4;letter-spacing:.08em}.step-auth{font:700 12px Arial,sans-serif;fill:#c65d55;letter-spacing:.08em}.label{font:14px Arial,sans-serif;fill:#405966}.small{font:12px Arial,sans-serif;fill:#657984}.code{font:12px Consolas,monospace;fill:#375566}
      .phase{fill:#f3f8fa;stroke:#e1eaee;stroke-width:1}.phase-auth{fill:#fff7f5;stroke:#f1ddda;stroke-width:1}.note{fill:#fff8ec;stroke:#f0d9ae;stroke-width:1.3}.note-title{font:700 14px Arial,sans-serif;fill:#815c21}.note-text{font:13px Arial,sans-serif;fill:#75664e}
    </style>
  </defs>
  <rect x="1" y="1" width="1438" height="1318" rx="22" fill="url(#page-bg)" stroke="#e5edf0"/>
  <text x="48" y="52" class="title">Client Authentication · Email &amp; Password</text>
  <text x="48" y="79" class="subtitle">Đăng ký tạo tài khoản; đăng nhập cấp phiên; BE giữ quyền kiểm soát danh tính và token.</text>

  <rect x="50" y="105" width="300" height="64" rx="13" class="participant participant-fe"/><text x="200" y="144" text-anchor="middle" class="participant-title">FE · Register / Login</text>
  <rect x="390" y="105" width="300" height="64" rx="13" class="participant participant-be"/><text x="540" y="144" text-anchor="middle" class="participant-title">BE · AuthController</text>
  <rect x="730" y="105" width="300" height="64" rx="13" class="participant participant-be"/><text x="880" y="144" text-anchor="middle" class="participant-title">BE · AuthService</text>
  <rect x="1070" y="105" width="320" height="64" rx="13" class="participant participant-db"/><text x="1230" y="144" text-anchor="middle" class="participant-title">AuthRepository · PostgreSQL</text>
  <path d="M200 169V1195M540 169V1195M880 169V1195M1230 169V1195" class="life"/>

  <rect x="36" y="190" width="1368" height="440" rx="16" class="phase"/>
  <text x="58" y="221" class="step">01 · ĐĂNG KÝ CLIENT</text>
  <path d="M200 260H540" class="arrow"/><text x="370" y="248" text-anchor="middle" class="code">POST /api/v1/auth/register</text>
  <path d="M540 310H880" class="arrow"/><text x="710" y="297" text-anchor="middle" class="label">DTO validation · kiểm soát lạm dụng</text>
  <path d="M880 360H1230" class="arrow"/><text x="1055" y="347" text-anchor="middle" class="label">Kiểm tra email trùng</text>
  <rect x="744" y="382" width="272" height="62" rx="12" class="participant"/><text x="880" y="407" text-anchor="middle" class="step">BĂM MẬT KHẨU</text><text x="880" y="429" text-anchor="middle" class="small">bcrypt trước khi lưu vào DB</text>
  <path d="M880 465H1230" class="arrow"/><text x="1055" y="452" text-anchor="middle" class="label">Transaction: tạo role CLIENT + user</text>
  <path d="M1230 515H880" class="arrow-return"/><text x="1055" y="502" text-anchor="middle" class="small">Kết quả tạo tài khoản</text>
  <path d="M540 565H200" class="arrow-return"/><text x="370" y="553" text-anchor="middle" class="label">201 Created · không tự đăng nhập</text>
  <rect x="78" y="580" width="244" height="34" rx="17" fill="#fff" stroke="#dce7eb"/><text x="200" y="602" text-anchor="middle" class="small">FE chuyển sang /auth/login</text>

  <rect x="36" y="652" width="1368" height="430" rx="16" class="phase-auth"/>
  <text x="58" y="684" class="step-auth">02 · ĐĂNG NHẬP VÀ CẤP PHIÊN</text>
  <path d="M200 725H540" class="arrow-auth"/><text x="370" y="713" text-anchor="middle" class="code">POST /api/v1/auth/client/login</text>
  <path d="M540 775H880" class="arrow-auth"/><text x="710" y="763" text-anchor="middle" class="label">Giới hạn lạm dụng · kiểm tra mật khẩu</text>
  <rect x="744" y="790" width="272" height="64" rx="12" class="participant"/><text x="880" y="816" text-anchor="middle" class="step-auth">KIỂM TRA QUYỀN</text><text x="880" y="838" text-anchor="middle" class="small">accountType Client · MFA chỉ cho Admin</text>
  <path d="M880 880H1230" class="arrow-auth"/><text x="1055" y="868" text-anchor="middle" class="label">Transaction: thu hồi phiên cookie cũ + tạo device/hash</text>
  <path d="M1230 925H880" class="arrow-return"/><text x="1055" y="913" text-anchor="middle" class="small">Phiên thiết bị đã lưu</text>
  <path d="M880 970H540" class="arrow-return"/><text x="710" y="958" text-anchor="middle" class="label">Access JWT 15 phút · Refresh JWT 7 ngày</text>
  <path d="M540 1022H200" class="arrow-return"/><text x="370" y="1010" text-anchor="middle" class="label">Set HttpOnly cookie · trả access token + user</text>

  <rect x="50" y="1110" width="1340" height="150" rx="16" class="note"/>
  <text x="78" y="1144" class="note-title">03 · DUY TRÌ / KẾT THÚC PHIÊN</text>
  <text x="78" y="1176" class="note-text">FE giữ access token trong bộ nhớ. Khi API trả 401, interceptor gọi refresh; BE xoay token và cập nhật cookie.</text>
  <text x="78" y="1202" class="note-text">Khi đăng xuất, BE thu hồi phiên thiết bị và xóa cookie; FE xóa trạng thái đăng nhập.</text>
  <text x="78" y="1224" class="note-text">Mỗi lần đăng nhập tạo một phiên browser mới, không nhận diện phần cứng máy.</text>
  <text x="78" y="1250" class="code">POST /api/v1/auth/client/refresh  ·  POST /api/v1/auth/client/logout</text>
</svg>
