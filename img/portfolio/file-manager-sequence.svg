<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1600" role="img" aria-labelledby="title desc">
  <title id="title">File upload and media retrieval sequence</title>
  <desc id="desc">Customer and admin applications use the Next.js proxy to request a single-use JWT upload ticket, send files to File Manager, store bytes on persistent storage and metadata in MongoDB, then save the returned media path through Linh_BE to PostgreSQL. Media reads return through the proxy.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#fbf8ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7f4ff"/><stop offset="1" stop-color="#eef1ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#29455a" flood-opacity=".1"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#637585"/></marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#18a4bd"/></marker>
    <style>
      text{font-family:Poppins,Arial,sans-serif}.title{fill:#163447;font-size:30px;font-weight:700;letter-spacing:.03em}.subtitle{fill:#708391;font-size:17px}.actor{fill:#163447;font-size:17px;font-weight:700}.lane{stroke:#aebbc4;stroke-width:2;stroke-dasharray:6 7}.message{stroke:#637585;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.reply{stroke:#18a4bd;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#return-arrow)}.label{fill:#314b5c;font-size:17px;font-weight:500}.step{fill:#e87970;font-size:13px;font-weight:700;letter-spacing:.08em}.pill{fill:#fff;stroke:#e1e9ee;stroke-width:1}.note{fill:#55717f;font-size:14px}
    </style>
  </defs>
  <rect width="1920" height="1600" rx="28" fill="url(#canvas)"/>
  <text x="72" y="57" class="title">FILE UPLOAD &amp; MEDIA RETRIEVAL</text>
  <text x="72" y="88" class="subtitle">Application-managed, single-use upload tickets · file bytes bypass the commerce API</text>

  <g filter="url(#shadow)">
    <rect x="45" y="112" width="220" height="64" rx="13" fill="url(#accent)" stroke="#76a9ff" stroke-width="2"/>
    <rect x="315" y="112" width="220" height="64" rx="13" fill="url(#accent)" stroke="#76a9ff" stroke-width="2"/>
    <rect x="585" y="112" width="220" height="64" rx="13" fill="#fff0ea" stroke="#f0a18a" stroke-width="2"/>
    <rect x="855" y="112" width="220" height="64" rx="13" fill="#eef8f2" stroke="#83c3a5" stroke-width="2"/>
    <rect x="1125" y="112" width="220" height="64" rx="13" fill="#eef4ff" stroke="#91aef2" stroke-width="2"/>
    <rect x="1395" y="112" width="220" height="64" rx="13" fill="#eef4ff" stroke="#91aef2" stroke-width="2"/>
    <rect x="1665" y="112" width="220" height="64" rx="13" fill="#eef4ff" stroke="#91aef2" stroke-width="2"/>
  </g>
  <g class="actor" text-anchor="middle">
    <text x="155" y="151">Customer / Admin</text>
    <text x="425" y="140"><tspan x="425">Linh_FE</tspan><tspan x="425" dy="21" font-size="14">Next.js Proxy</tspan></text>
    <text x="695" y="151">File Manager</text>
    <text x="965" y="140"><tspan x="965">Persistent</tspan><tspan x="965" dy="21" font-size="14">File Storage</tspan></text>
    <text x="1235" y="151">MongoDB</text>
    <text x="1505" y="151">Linh_BE</text>
    <text x="1775" y="151">PostgreSQL</text>
  </g>
  <g class="lane">
    <path d="M155 176v1355"/><path d="M425 176v1355"/><path d="M695 176v1355"/><path d="M965 176v1355"/><path d="M1235 176v1355"/><path d="M1505 176v1355"/><path d="M1775 176v1355"/>
  </g>

  <g>
    <text x="72" y="211" class="step">01 · SELECT</text><path d="M155 226H425" class="message"/><text x="290" y="216" class="label" text-anchor="middle">Select a file</text>
    <text x="342" y="292" class="step">02 · AUTHORIZE</text><path d="M425 307H695" class="message"/><text x="560" y="297" class="label" text-anchor="middle">Request upload ticket with access JWT</text>
    <text x="612" y="373" class="step">03 · VALIDATE</text><path d="M695 385h66v22h-66" class="message"/><text x="783" y="384" class="label">Authenticate JWT; enforce type and size limits</text>
    <text x="1077" y="458" class="step">04 · REGISTER TICKET</text><path d="M695 473H1235" class="message"/><text x="965" y="463" class="label" text-anchor="middle">Store ticket hash, expiry, and file constraints</text>
    <text x="342" y="543" class="step">05 · ISSUE</text><path d="M695 558H425" class="reply"/><text x="560" y="548" class="label" text-anchor="middle">Return a single-use upload ticket</text>
    <text x="342" y="628" class="step">06 · UPLOAD</text><path d="M425 643H695" class="message"/><text x="560" y="633" class="label" text-anchor="middle">Send file bytes through the proxy</text>
    <text x="612" y="713" class="step">07 · INSPECT</text><path d="M695 725h66v22h-66" class="message"/><text x="783" y="724" class="label">Stage file; verify signature; process images</text>
    <text x="882" y="798" class="step">08 · PERSIST BYTES</text><path d="M695 813H965" class="message"/><text x="830" y="803" class="label" text-anchor="middle">Write finalized file bytes</text>
    <text x="1077" y="883" class="step">09 · SAVE METADATA</text><path d="M695 898H1235" class="message"/><text x="965" y="888" class="label" text-anchor="middle">Save asset metadata and relative path</text>
    <text x="342" y="968" class="step">10 · RETURN PATH</text><path d="M695 983H425" class="reply"/><text x="560" y="973" class="label" text-anchor="middle">Return media path: /uploads/…</text>
    <text x="1347" y="1053" class="step">11 · SAVE BUSINESS DATA</text><path d="M425 1068H1505" class="message"/><text x="965" y="1058" class="label" text-anchor="middle">Submit product data with the returned media path</text>
    <text x="1617" y="1138" class="step">12 · PERSIST RECORD</text><path d="M1505 1153H1775" class="message"/><text x="1640" y="1143" class="label" text-anchor="middle">Store path with the business record</text>
    <text x="72" y="1223" class="step">13 · READ MEDIA</text><path d="M155 1238H425" class="message"/><text x="290" y="1228" class="label" text-anchor="middle">Request an image or file</text>
    <text x="342" y="1308" class="step">14 · PROXY GET</text><path d="M425 1323H695" class="message"/><text x="560" y="1313" class="label" text-anchor="middle">Proxy GET /uploads/…</text>
    <text x="342" y="1393" class="step">15 · SERVE</text><path d="M695 1408H425" class="reply"/><text x="560" y="1398" class="label" text-anchor="middle">Return stored media</text>
    <path d="M425 1493H155" class="reply"/><text x="290" y="1483" class="label" text-anchor="middle">Deliver media to the client</text>
  </g>

  <g>
    <rect x="585" y="1537" width="760" height="38" rx="19" class="pill"/>
    <text x="965" y="1562" class="note" text-anchor="middle">MongoDB stores metadata · persistent storage holds bytes · PostgreSQL stores the ecommerce reference</text>
  </g>
</svg>
